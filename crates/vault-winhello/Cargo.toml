# Windows Hello user-presence verification, done the way the OS wants it.
#
# Its own crate for the same reason vault-appgroup is: the app crates carry
# #![forbid(unsafe_code)], and WinRT COM interop is unavoidably unsafe. The
# unsafe lives here, in ~30 lines that can be read in one sitting.
[package]
name = "vault-winhello"
description = "Windows Hello verification parented to a real window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
# The version Tauri's own Windows stack uses, so one copy is built.
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
# The WinRT async types (IAsyncOperation) left `windows` for this crate.
windows-future = "0.3"

# Not the workspace's lints, which forbid `unsafe`: this crate calls Windows
# Hello's WinRT API, so nothing else has to.
[lints.clippy]
too_many_lines = "warn"
