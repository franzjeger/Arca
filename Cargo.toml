[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/vault-store",
    "crates/vault-ffi",
    "crates/vault-secmem",
    "crates/vault-appgroup",
    "crates/vault-winhello",
    "crates/vault-credstore",
    "crates/vault-sharedkey",
    "crates/vault-sync",
    "crates/vault-bridge",
    "apps/desktop/src-tauri",
    "apps/cli",
    "extension/native-host",
]
# Its own workspace, built by cargo-fuzz on nightly.
exclude = ["fuzz"]

# Keep the heavy Tauri desktop build out of the default `cargo build`/`test` at
# the workspace root; build it explicitly with `-p vault-desktop` (or via the
# Tauri CLI). The other crates are fast and fully testable here.
default-members = [
    "crates/vault-core",
    "crates/vault-store",
    "crates/vault-ffi",
    "crates/vault-secmem",
    "crates/vault-sync",
    "crates/vault-bridge",
    "apps/cli",
    "extension/native-host",
]

[workspace.package]
version = "0.8.5"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["SYBR AS <support@sybr.no>"]
repository = "https://github.com/franzjeger/Arca"
# Arca's parts, not libraries for others: nothing here goes to crates.io.
publish = false

[workspace.lints.rust]
# Safe by default. The crates that wrap an OS or C interface opt out in their
# own manifests, where it shows.
unsafe_code = "forbid"

[workspace.lints.clippy]
# A function longer than a screen hides its structure. This is what keeps the
# next thousand-line match out; a test that reads as one scenario is exempted
# where it is written.
too_many_lines = "warn"

[workspace.dependencies]
# --- internal ---
vault-core = { path = "crates/vault-core" }
vault-store = { path = "crates/vault-store" }
vault-secmem = { path = "crates/vault-secmem" }
vault-appgroup = { path = "crates/vault-appgroup" }
vault-sync = { path = "crates/vault-sync" }
vault-bridge = { path = "crates/vault-bridge" }

# --- crypto (audited RustCrypto crates only; no custom primitives) ---
# `zeroize` wipes the hashes Argon2 starts and ends with, either of which
# gives the key without the password; its memory is ours (crypto.rs).
argon2 = { version = "0.6", features = ["zeroize"] }
# 0.10 always wiped the cipher's copy of the key when dropped; since 0.11
# that takes `zeroize`.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
subtle = "2.6"
hmac = "0.13"
# Keys derived from the vault key, one per job (V7).
hkdf = "0.13"
# `zeroize` wipes hash state when dropped. HMAC and HKDF keep their keyed
# state in these hashes' cores, so it covers them too.
sha1 = { version = "0.11", features = ["zeroize"] }
sha2 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
data-encoding = "2.6"
# Cross-platform mlock/VirtualLock so secret memory can't be paged to swap.
region = "4"
# WebAuthn passkeys: ES256 (P-256 ECDSA). RustCrypto, no custom EC math.
# New keys come from the OS CSPRNG through p256's own `getrandom` feature.
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
# SSH agent keys: Ed25519 (dalek, audited). The OpenSSH wire encoding is
# hand-rolled from length-prefixed strings and tested byte-exactly against the
# ssh CLI; signing stays internal so the private key never leaves the vault.
# Seeds come from `getrandom` (not dalek's RNG helper), so no `rand_core` feature.
ed25519-dalek = { version = "3", features = ["zeroize"] }
# Reading keys people already have in ~/.ssh: the OpenSSH private-key container
# and its passphrase encryption (bcrypt-pbkdf + AES), RustCrypto. Only parsing;
# every key it yields is signed with dalek above, like one Arca generated.
# 0.6 is still on the previous generation of the RustCrypto traits (0.7 is
# only a release candidate), so Cargo.lock carries both generations for now.
# Tests take its RNG from the rand_core it re-exports, so nothing here names
# the old rand_core directly.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "encryption"] }

# --- serde / data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ciborium (CBOR): self-describing, name-tagged encoding for the at-rest item
# payload, so the VaultItem schema can evolve (variant reorder/append) safely.
ciborium = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
# Public Suffix List, compiled in — so a page can't scope a passkey to an eTLD
# (e.g. "github.io", "co.uk") that crosses mutually-distrusting tenants.
url = "2"
psl = "2"

# --- network ---
# rustls rather than the platform TLS stack, so certificate verification behaves
# identically on every target rather than inheriting each OS's quirks. Blocking:
# sync owns a thread on every platform and the engine stays an ordinary function
# a test can call.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

# Release: stripped and LTO'd. A panicking desktop process stops instead of
# carrying on in a state nobody tested.
[profile.release]
panic = "abort"
strip = true
lto = true

# The Apple apps' static library. vault-ffi turns a panic into an error code
# with `catch_unwind`, which only works when panics unwind; under `abort` a
# panic kills the app or AutoFill extension instead. vault-ffi refuses to
# compile any other way, so build it with `--profile release-ffi`.
[profile.release-ffi]
inherits = "release"
panic = "unwind"
